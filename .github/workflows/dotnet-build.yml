name: PR Project Build

permissions:
  contents: read

# When this builds (Jumoo/jumoo-context#159, from its templates/workflows/dotnet-build.yml):
#
# - Dependabot PRs. Nobody builds those locally, so CI is the only check they get.
# - Other PRs: no. /commit-pr builds and tests locally before opening the PR. The
#   build job is skipped, which still satisfies a required status check.
# - Nightly: each v{N}/main with commits in the last day, so a break from combined
#   changes shows up the next morning. Dispatched, so each branch builds with its own
#   copy of this file.
# - On demand: Actions > Run workflow, on any branch.
#
# NOTE: Jumoo repos release from "{version}/main" - a branch per Umbraco major. Plain
# "main" is kept in the filter so a re-created main, or a branch that hasn't been moved
# over yet, still builds - a past repo had a workflow that silently never ran because its
# filter didn't match the branch it was meant to watch.
on:
  pull_request:
    branches: [ "main", "*/main" ]
    paths-ignore:
      - "**.md"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  config: Release
  # the CI solution: every package project plus the test projects. The *.Site test site is
  # deliberately not in it, so a broken starter kit can never fail a build or a release.
  solution: ./uSync.AI-CI.slnx

jobs:
  # Schedules only run on the default branch, so this job dispatches the build on each
  # release branch that changed, rather than building it here.
  nightly:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: dispatch a build for each branch changed in the last day
        run: |
          since=$(date -u -d '25 hours ago' +%s)
          gh api "repos/$GITHUB_REPOSITORY/branches" --paginate -q '.[].name' \
            | grep -E '^(v[0-9]+/)?main$' \
            | while read -r branch; do
                committed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" -q .commit.committer.date)
                if [ "$(date -u -d "$committed" +%s)" -ge "$since" ]; then
                  echo "$branch changed $committed - building"
                  # an old branch (v13/main) may not have this workflow; don't let it stop the rest
                  gh workflow run dotnet-build.yml --repo "$GITHUB_REPOSITORY" --ref "$branch" \
                    || echo "::warning::couldn't dispatch a build on $branch"
                else
                  echo "$branch unchanged since $committed - skipping"
                fi
              done

  build-project:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # the client bundle is built by the csproj (npm ci + npm run build) during dotnet build
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "**/package-lock.json"

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: restore
        run: dotnet restore ${{ env.solution }}

      - name: build
        run: >
          dotnet build ${{ env.solution }}
          -c ${{ env.config }} --no-restore
          -p:ContinuousIntegrationBuild=true

      - name: test
        run: >
          dotnet test ${{ env.solution }}
          -c ${{ env.config }} --no-build
